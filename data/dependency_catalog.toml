# Curated rules for requirements not betrayed by direct files
[[app_rules]]
app_matches = ["fifa 23"]
publisher_matches = []
target_id = "ea-app"
reason = "EA Sports title requires EA App client & EABackgroundService"

[[app_rules]]
app_matches = ["fifa 23"]
publisher_matches = []
target_id = "ea-anticheat"
reason = "FIFA 23 requires kernel-mode EA AntiCheat"

[[app_rules]]
app_matches = ["fifa 23"]
publisher_matches = []
install_path_contains = "steamapps"
target_id = "steam"
reason = "Steam edition launches through Steam client"

[[app_rules]]
app_matches = ["fifa 23"]
publisher_matches = []
target_id = "denuvo"
reason = "FIFA 23 uses Denuvo Anti-Tamper DRM"

[[app_rules]]
app_matches = []
publisher_matches = ["electronic arts", "ea canada"]
install_path_contains = "steamapps"
target_id = "ea-app"
reason = "EA Steam release bridges via EA App"

# Official Epic Games docs: Epic Games Launcher installs & depends on the Epic Online Services companion service and EOS overlay
# Source: https://dev.epicgames.com/docs/epic-online-services/eos-platform-interface/eos-platform-overview
[[app_rules]]
app_matches = ["epic games launcher"]
publisher_matches = ["epic games"]
target_id = "epic-online-services"
reason = "Epic Games Launcher bundles and runs Epic Online Services (source: dev.epicgames.com/docs/epic-online-services)"
