# Authored Dependency Catalog for y-storage (`dependencies`)
# Small, deterministic, and high-precision seed catalog.

[[targets]]
id = "vcpp-runtime"
name = "Microsoft Visual C++ Runtime"
kind = "SharedRuntime"
shared = true
registry_matches = ["microsoft visual c++"]
service_names = []
presence_paths = [
  "C:\\Windows\\System32\\vcruntime140.dll",
  "C:\\Windows\\System32\\msvcp140.dll",
]

[[targets]]
id = "directx-runtime"
name = "DirectX Runtime"
kind = "SharedRuntime"
shared = true
registry_matches = ["directx"]
service_names = []
presence_paths = [
  "C:\\Windows\\System32\\d3d11.dll",
  "C:\\Windows\\System32\\dxgi.dll",
  "C:\\Windows\\System32\\D3DCOMPILER_47.dll",
]

[[targets]]
id = "dotnet-runtime"
name = "Microsoft .NET Runtime"
kind = "SharedRuntime"
shared = true
registry_matches = ["microsoft .net", "windows desktop runtime"]
service_names = []
presence_paths = [
  "C:\\Program Files\\dotnet\\dotnet.exe",
  "C:\\Windows\\Microsoft.NET\\Framework64",
]

[[targets]]
id = "webview2-runtime"
name = "Microsoft Edge WebView2 Runtime"
kind = "SharedRuntime"
shared = true
registry_matches = ["edge webview2"]
service_names = []
presence_paths = [
  "C:\\Program Files (x86)\\Microsoft\\EdgeWebView\\Application",
]

